<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>보고서 문장 공식</title>
<link rel="icon" href="data:," />
<!-- 이 파일은 scripts/build_patterns.py가 assets/sentence-patterns.json으로 만든다. 직접 고치지 말고 템플릿이나 JSON을 고친다. -->
<style>
:root {
  color-scheme: light;
  --bg: #f4f5f7; --card: #ffffff; --line: #e2e6ec;
  --ink: #16191e; --ink-2: #555d6b; --ink-3: #9098a6;
  --accent: #1f4f8a; --accent-soft: #eaf1fa; --blank: #fff6dc; --blank-line: #e5bf55;
  --font: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", "맑은 고딕", "Noto Sans KR", sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 16px; line-height: 1.6; }
button, input { font: inherit; color: inherit; }
.page { max-width: 760px; margin: 0 auto; padding: 32px 20px 56px; }
h1 { margin: 0; font-size: 24px; letter-spacing: -.02em; }
.lead { margin: 4px 0 0; color: var(--ink-2); }

.step { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 20px; margin-bottom: 14px; }
.step h2 { margin: 0 0 14px; font-size: 17px; display: flex; align-items: center; gap: 10px; }
.num { display: inline-grid; place-items: center; width: 26px; height: 26px; border-radius: 50%; background: var(--accent); color: #fff; font-size: 14px; flex: none; }

/* ① 하고 싶은 말 */
.kinds { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
.kind { text-align: left; border: 1.5px solid var(--line); background: #fff; border-radius: 10px; padding: 10px 12px; cursor: pointer; }
.kind:hover { border-color: var(--accent); }
.kind b { display: block; font-size: 16px; }
.kind span { display: block; font-size: 13px; color: var(--ink-3); }
.kind[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
.kind[aria-pressed="true"] span { color: var(--accent); }

/* ② 공식 고르기 */
.forms { display: grid; gap: 8px; }
.form { text-align: left; border: 1.5px solid var(--line); background: #fff; border-radius: 10px; padding: 10px 14px; cursor: pointer; display: flex; gap: 12px; align-items: baseline; }
.form:hover { border-color: var(--accent); }
.form[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
.form .combo { font-weight: 700; white-space: nowrap; }
.form .shape { color: var(--ink-2); font-size: 14px; }

/* ③ 빈칸 채우기 */
.madlib { font-size: 19px; line-height: 2.4; word-break: keep-all; }
.madlib input { border: 0; border-bottom: 2px solid var(--blank-line); background: var(--blank); border-radius: 4px 4px 0 0; padding: 0 6px; margin: 0 2px; font-size: 17px; min-width: 4em; max-width: 100%; line-height: 1.7; }
.madlib input:focus { outline: none; border-bottom-color: var(--accent); background: #fff; box-shadow: 0 0 0 2px var(--accent-soft); }
.madlib input::placeholder { color: #b08a1e; }
.legend { margin: 10px 0 0; font-size: 13.5px; color: var(--ink-3); }
.legend b { color: var(--ink-2); font-weight: 600; }
.tip { margin: 12px 0 0; font-size: 14px; color: var(--ink-2); }

.done { margin-top: 18px; padding: 14px 16px; border-radius: 10px; background: var(--accent-soft); }
.done .label { font-size: 13px; font-weight: 700; color: var(--accent); }
.done .text { font-size: 18px; font-weight: 600; margin: 2px 0 10px; word-break: keep-all; min-height: 1.6em; }
.done .text.empty { color: var(--ink-3); font-weight: 400; font-size: 15px; }
.actions { display: flex; gap: 8px; }
.btn { border: 1.5px solid var(--accent); background: var(--accent); color: #fff; border-radius: 8px; padding: 6px 16px; cursor: pointer; font-weight: 600; font-size: 15px; }
.btn.ghost { background: transparent; color: var(--accent); }
.btn:disabled { opacity: .4; cursor: default; }

details { margin-top: 14px; }
summary { cursor: pointer; color: var(--accent); font-size: 14.5px; font-weight: 600; }
.examples { margin: 10px 0 0; padding-left: 20px; color: var(--ink-2); font-size: 14.5px; }
.examples li { margin: 4px 0; }
.examples-note { font-size: 12.5px; color: var(--ink-3); margin: 6px 0 0; }

.top { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; margin-bottom: 24px; }
.guide-btn { flex: none; border: 1.5px solid var(--accent); background: #fff; color: var(--accent); border-radius: 999px; padding: 6px 14px; cursor: pointer; font-weight: 600; font-size: 14.5px; white-space: nowrap; }
.guide-btn:hover { background: var(--accent-soft); }

/* 사용안내서 창 */
dialog.guide { width: min(820px, calc(100% - 24px)); max-height: calc(100% - 24px); padding: 0; border: 0; border-radius: 14px; box-shadow: 0 20px 60px rgba(0,0,0,.25); color: var(--ink); }
dialog.guide::backdrop { background: rgba(15, 20, 30, .45); }
.guide-head { position: sticky; top: 0; display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 14px 20px; background: var(--accent); color: #fff; z-index: 1; }
.guide-head h2 { margin: 0; font-size: 18px; }
.guide-close { border: 1.5px solid rgba(255,255,255,.6); background: transparent; color: #fff; border-radius: 8px; padding: 4px 12px; cursor: pointer; font-weight: 600; }
.guide-close:hover { background: rgba(255,255,255,.12); }
.guide-body { padding: 8px 24px 28px; font-size: 15px; line-height: 1.7; }
.guide-body h3 { margin: 26px 0 8px; font-size: 17px; color: var(--accent); padding-left: 10px; border-left: 4px solid var(--accent); }
.guide-body p { margin: 8px 0; }
.guide-body ul, .guide-body ol { margin: 8px 0; padding-left: 22px; }
.guide-body li { margin: 4px 0; }
.guide-body li ul { margin: 4px 0; }
.guide-body code { background: #f1f3f6; border-radius: 4px; padding: 1px 5px; font-size: 13.5px; }
.guide-body .table-wrap { overflow-x: auto; margin: 10px 0; border: 1px solid var(--line); border-radius: 8px; }
.guide-body table { border-collapse: collapse; width: 100%; font-size: 14px; }
.guide-body th, .guide-body td { border-bottom: 1px solid var(--line); padding: 8px 10px; text-align: left; vertical-align: top; }
.guide-body th { background: #f5f7fa; color: var(--ink-2); white-space: nowrap; }
.guide-body tr:last-child td { border-bottom: 0; }
.guide-body .code { position: relative; margin: 10px 0; }
.guide-body pre { margin: 0; background: #f5f7fa; border: 1px solid var(--line); border-radius: 8px; padding: 14px 16px; font-size: 13.5px; white-space: pre-wrap; word-break: keep-all; }
.guide-body .copy-code { position: absolute; top: 8px; right: 8px; padding: 3px 10px; font-size: 13px; background: #fff; }

/* 이 칸에 쓸 말 */
.sg { margin-top: 10px; padding: 12px 14px; border: 1px dashed var(--line); border-radius: 10px; background: #fbfcfd; }
.sg-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; font-size: 14px; }
.sg-head b { color: var(--accent); }
.sg-head span { color: var(--ink-3); font-size: 12.5px; }
.sg-groups { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; align-items: center; }
.sg-group { border: 1px solid var(--line); background: #fff; border-radius: 999px; padding: 2px 10px; font-size: 13px; cursor: pointer; color: var(--ink-2); }
.sg-group[aria-pressed="true"] { border-color: var(--accent); background: var(--accent); color: #fff; }
.sg-more { border: 1px solid var(--line); border-radius: 999px; padding: 2px 8px; font-size: 13px; background: #fff; color: var(--ink-2); max-width: 100%; }
.words { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.word { border: 1.5px solid var(--blank-line); background: var(--blank); border-radius: 8px; padding: 2px 10px; font-size: 14.5px; cursor: pointer; }
.word:hover { background: #fff; }
.word.hit { border-color: var(--accent); background: var(--accent-soft); font-weight: 700; }
.sg-desc { margin: 8px 0 0; font-size: 12.5px; color: var(--ink-3); }
.sg-desc .warn { color: #a8431a; }

/* 다른 말 찾기 */
.find summary { list-style: none; cursor: pointer; display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px; }
.find summary::-webkit-details-marker { display: none; }
.find summary b { font-size: 17px; }
.find summary span { color: var(--ink-3); font-size: 14px; }
.find summary::after { content: "펼치기 ▾"; margin-left: auto; color: var(--accent); font-size: 14px; font-weight: 600; }
.find[open] summary::after { content: "접기 ▴"; }
.find-row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-top: 14px; }
.find-row input[type=search] { flex: 1 1 240px; border: 1.5px solid var(--line); border-radius: 8px; padding: 8px 12px; font-size: 16px; }
.find-row input[type=search]:focus { outline: none; border-color: var(--accent); }
.find-row label { font-size: 13px; color: var(--ink-2); }
.fr { border-top: 1px solid var(--line); padding: 12px 0 2px; }
.fr:first-child { border-top: 0; }
.fr-h { font-size: 14px; }
.fr-h b { font-size: 15px; }
.fr-h .cat { display: inline-block; font-size: 12px; color: var(--accent); background: var(--accent-soft); border-radius: 4px; padding: 0 6px; margin: 0 4px; }
.fr-h .d { color: var(--ink-3); }
.find-empty { color: var(--ink-3); font-size: 14px; margin: 12px 0 0; }

footer { margin-top: 24px; font-size: 12.5px; color: var(--ink-3); text-align: center; }
.toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--ink); color: #fff; padding: 8px 16px; border-radius: 8px; font-size: 14px; opacity: 0; transition: opacity .2s; pointer-events: none; }
.toast.show { opacity: 1; }
#measure { position: absolute; visibility: hidden; white-space: pre; font-size: 17px; padding: 0 6px; }

@media (max-width: 560px) {
  .page { padding: 22px 16px 44px; }
  h1 { font-size: 21px; }
  .step { padding: 16px; }
  .kinds { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .form { flex-direction: column; gap: 0; }
  .madlib { font-size: 17px; }
  .top { flex-direction: column; }
  .guide-body { padding: 4px 16px 24px; }
}
</style>
</head>
<body>
<div class="page">
  <div class="top">
    <div>
      <h1>보고서 문장 공식</h1>
      <p class="lead">하고 싶은 말을 고르고, 빈칸만 채우면 보고서 문장이 됩니다.</p>
    </div>
    <button type="button" class="guide-btn" id="openGuide" aria-haspopup="dialog">📘 보고서 문장 공식 사용안내서</button>
  </div>

  <section class="step">
    <h2><span class="num">1</span>어떤 말을 하고 싶나요?</h2>
    <div id="kinds" class="kinds"></div>
  </section>

  <section class="step" id="formStep">
    <h2><span class="num">2</span>공식을 고르세요</h2>
    <div id="forms" class="forms"></div>
  </section>

  <section class="step">
    <h2><span class="num" id="fillNum">3</span>빈칸을 채우세요</h2>
    <div id="madlib" class="madlib"></div>
    <div id="sg" class="sg" aria-live="polite"></div>
    <p id="legend" class="legend"></p>
    <p id="tip" class="tip"></p>
    <div class="done">
      <div class="label">완성 문장</div>
      <div id="result" class="text"></div>
      <div class="actions">
        <button type="button" class="btn" id="copy">복사</button>
        <button type="button" class="btn ghost" id="clear">지우기</button>
      </div>
    </div>
    <details id="exBox">
      <summary id="exSummary">예문 보기</summary>
      <ul id="examples" class="examples"></ul>
      <p class="examples-note">구조만 참고하세요. 회사명과 수치는 가렸습니다.</p>
    </details>
  </section>

  <section class="step">
    <details class="find" id="findBox">
      <summary><b>🔁 다른 말 찾기</b><span>흔한 말을 넣으면 같은 자리에 쓰는 보고서 말을 보여 줍니다</span></summary>
      <div class="find-row">
        <input type="search" id="findQ" placeholder="예: 개선, 늘리다, 문제, 그리고" autocomplete="off" aria-label="찾을 말" />
        <label><input type="checkbox" id="findDomain" /> 분야 어휘 포함 (HRD·스마트팩토리·설문)</label>
      </div>
      <div id="findResults"></div>
    </details>
  </section>

  <footer id="about"></footer>
</div>
<dialog class="guide" id="guide" aria-labelledby="guideTitle">
  <div class="guide-head">
    <h2 id="guideTitle">보고서 문장 공식 사용안내서</h2>
    <button type="button" class="guide-close" id="closeGuide">닫기</button>
  </div>
  <div class="guide-body">
<!--__GUIDE_HTML__-->
  </div>
</dialog>
<span id="measure"></span>
<div id="toast" class="toast" role="status"></div>

<script>
const DATA = /*__PATTERN_DATA__*/null;
const VOCAB = /*__VOCAB_DATA__*/null;

const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const state = { rel: DATA.relations[0].id, pid: null, values: {}, focus: null, vgroup: {}, lastIns: {} };

/* 조사: 앞말 받침에 맞춰 고른다 (받침을 알 수 없으면 '은(는)'처럼 둘 다) */
const JOSA = {
  '은': ['은', '는', '은(는)'], '이': ['이', '가', '이(가)'], '을': ['을', '를', '을(를)'], '과': ['과', '와', '과(와)'],
  '으로': ['으로', '로', '(으)로'], '이란': ['이란', '란', '(이)란'], '이나': ['이나', '나', '(이)나'],
  '이었으나': ['이었으나', '였으나', '(이)었으나'],
};
const DIGIT_JONG = { '0': 21, '1': 8, '2': 0, '3': 16, '4': 0, '5': 0, '6': 1, '7': 8, '8': 8, '9': 0 }; // 영 일 이 삼 사 오 육 칠 팔 구
function jong(word) {
  const s = String(word).replace(/[\s)\]」』’'"”.,·∙!?%]+$/u, '');
  const ch = s.slice(-1);
  if (!ch) return null;
  const c = ch.charCodeAt(0);
  if (c >= 0xAC00 && c <= 0xD7A3) return (c - 0xAC00) % 28;
  return ch in DIGIT_JONG ? DIGIT_JONG[ch] : null;
}
function josaFor(word, josa) {
  const [withJ, withoutJ, unknown] = JOSA[josa];
  const j = word ? jong(word) : null;
  if (j === null) return unknown;
  if (josa === '으로') return j === 0 || j === 8 ? '로' : '으로'; // ㄹ받침은 '로'
  return j === 0 ? withoutJ : withJ;
}

/* 템플릿을 글자 조각과 빈칸 조각으로 나눈다 */
function parts(tpl) {
  const out = []; let last = 0; const re = /\{([^}:]+)(?::([^}]+))?\}/g; let m;
  while ((m = re.exec(tpl))) {
    if (m.index > last) out.push({ text: tpl.slice(last, m.index) });
    out.push({ slot: m[1], josa: m[2] });
    last = re.lastIndex;
  }
  if (last < tpl.length) out.push({ text: tpl.slice(last) });
  return out;
}
function shape(tpl) { return parts(tpl).map(p => p.text ?? `(${p.slot})` + (p.josa ? JOSA[p.josa][2] : '')).join(''); }
function sentence(tpl) {
  return parts(tpl).map(p => {
    if (p.text != null) return p.text;
    const v = (state.values[p.slot] || '').trim();
    return (v || `(${p.slot})`) + (p.josa ? josaFor(v, p.josa) : '');
  }).join('');
}

const patternsOf = rel => DATA.patterns.filter(p => p.relation === rel);
const current = () => DATA.patterns.find(p => p.id === state.pid);

/* ① 하고 싶은 말 */
function renderKinds() {
  $('kinds').innerHTML = DATA.relations.map(r =>
    `<button type="button" class="kind" data-rel="${r.id}" aria-pressed="${r.id === state.rel}"><b>${esc(r.name)}</b><span>${esc(r.hint)}</span></button>`).join('');
  $('kinds').querySelectorAll('.kind').forEach(b => b.addEventListener('click', () => {
    state.rel = b.dataset.rel; state.pid = patternsOf(state.rel)[0].id; render();
  }));
}
/* ② 공식 — 하나뿐이면 이 단계를 숨긴다 */
function renderForms() {
  const list = patternsOf(state.rel);
  $('formStep').hidden = list.length < 2;
  $('fillNum').textContent = list.length < 2 ? '2' : '3';
  $('forms').innerHTML = list.map(p =>
    `<button type="button" class="form" data-id="${p.id}" aria-pressed="${p.id === state.pid}"><span class="combo">${esc(p.slots.join(' + '))}</span><span class="shape">${esc(shape(p.template))}</span></button>`).join('');
  $('forms').querySelectorAll('.form').forEach(b => b.addEventListener('click', () => { state.pid = b.dataset.id; renderForms(); renderFill(); }));
}
/* ③ 빈칸 — 문장 모양 그대로 빈칸에 입력한다 */
function renderFill() {
  const p = current();
  $('madlib').innerHTML = parts(p.template).map(x => x.text != null
    ? `<span>${esc(x.text)}</span>`
    : `<input data-slot="${esc(x.slot)}" placeholder="${esc(x.slot)}" aria-label="${esc(x.slot)}: ${esc(DATA.slots[x.slot] || '')}" value="${esc(state.values[x.slot] || '')}" autocomplete="off" />` +
      (x.josa ? `<span class="josa" data-josa="${x.josa}" data-for="${esc(x.slot)}"></span>` : '')).join('');
  $('legend').innerHTML = p.slots.map(s => `<b>${esc(s)}</b> ${esc(DATA.slots[s] || '')}`).join(' · ');
  $('tip').textContent = '💡 ' + p.tip;
  $('exSummary').textContent = `예문 ${p.examples.length}개 보기`;
  $('examples').innerHTML = p.examples.map(e => `<li>${esc(e)}</li>`).join('');
  $('madlib').querySelectorAll('input').forEach(inp => {
    inp.addEventListener('input', () => { state.values[inp.dataset.slot] = inp.value; update(); });
    inp.addEventListener('focus', () => { if (state.focus !== inp.dataset.slot) { state.focus = inp.dataset.slot; renderSuggest(); } });
  });
  update();
  renderSuggest();
}
function fit(inp) {
  const m = $('measure'); m.textContent = inp.value || inp.placeholder;
  inp.style.width = Math.min(m.offsetWidth + 16, $('madlib').clientWidth) + 'px';
}
function update() {
  const p = current();
  $('madlib').querySelectorAll('input').forEach(fit);
  $('madlib').querySelectorAll('.josa').forEach(j => { j.textContent = josaFor((state.values[j.dataset.for] || '').trim(), j.dataset.josa); });
  const filled = p.slots.filter(s => (state.values[s] || '').trim()).length;
  const r = $('result');
  if (!filled) { r.textContent = '빈칸을 채우면 여기에 문장이 완성됩니다.'; r.classList.add('empty'); }
  else { r.textContent = sentence(p.template); r.classList.remove('empty'); }
  $('copy').disabled = filled === 0;
}
function render() { renderKinds(); renderForms(); renderFill(); }

/* ── 보고서 어휘: 이 칸에 쓸 말 ── */
const VG = Object.fromEntries(VOCAB.groups.map(g => [g.id, g]));
// 패턴 빈칸 이름 → 어휘의 빈칸 이름
const SLOT_MAP = { '대상1': '대상', '대상2': '대상', '상태1': '상태', '상태2': '상태', '이전': '상태', '이후': '상태',
  '전체': '대상', '부분': '대상', '세부1': '문제', '세부2': '문제', '종합': '행동', '단계1': '행동', '단계2': '행동', '단계3': '행동' };
const vslot = s => SLOT_MAP[s] || s;
const wordChips = (words, hit) => words.map(w => `<button type="button" class="word${hit && hit(w) ? ' hit' : ''}" data-w="${esc(w)}">${esc(w)}</button>`).join('');

function renderSuggest() {
  const p = current(), box = $('sg');
  const slot = p.slots.includes(state.focus) ? state.focus : p.slots[0];
  const vs = vslot(slot);
  const all = VOCAB.groups.filter(g => g.domain === '일반' && g.slots.includes(vs));
  if (!all.length) { box.hidden = true; return; }
  box.hidden = false;
  const featured = (VOCAB.featured_by_slot[vs] || []).filter(id => VG[id]);
  const sel = VG[state.vgroup[vs]] ? state.vgroup[vs] : (featured[0] || all[0].id);
  const others = all.filter(g => !featured.includes(g.id));
  const g = VG[sel];
  box.innerHTML = `
    <div class="sg-head"><b>‘${esc(slot)}’ 칸에 쓸 말</b><span>단어를 누르면 칸에 들어갑니다</span></div>
    <div class="sg-groups">${featured.map(id => `<button type="button" class="sg-group" data-g="${id}" aria-pressed="${id === sel}">${esc(VG[id].name)}</button>`).join('')}
      ${others.length ? `<select class="sg-more" aria-label="다른 묶음"><option value="">더 보기 (${others.length}묶음)</option>${others.map(o => `<option value="${o.id}"${o.id === sel ? ' selected' : ''}>${esc(o.name)}</option>`).join('')}</select>` : ''}</div>
    <div class="words">${wordChips(g.words)}</div>
    <p class="sg-desc">${esc(g.desc)}${g.cautions.length ? ` · <span class="warn">주의: ${esc(g.cautions.join(' / '))}</span>` : ''}</p>`;
  box.querySelectorAll('.sg-group').forEach(b => b.addEventListener('click', () => { state.vgroup[vs] = b.dataset.g; renderSuggest(); }));
  box.querySelector('.sg-more')?.addEventListener('change', e => { if (e.target.value) { state.vgroup[vs] = e.target.value; renderSuggest(); } });
  box.querySelectorAll('.word').forEach(b => {
    b.addEventListener('mousedown', e => e.preventDefault()); // 입력 칸의 커서를 유지
    b.addEventListener('click', () => insertWord(slot, b.dataset.w));
  });
}
// 선택한 글자가 있으면 바꾸고, 방금 넣은 단어가 끝에 있으면 그 단어만 바꾸고, 아니면 뒤에 한 칸 띄어 붙인다
function insertWord(slot, w) {
  const inp = $('madlib').querySelector(`input[data-slot="${CSS.escape(slot)}"]`);
  if (!inp) return;
  const v = inp.value.replace(/\s+$/, ''), a = inp.selectionStart, b = inp.selectionEnd, last = state.lastIns[slot];
  let nv;
  if (document.activeElement === inp && a !== b) nv = inp.value.slice(0, a) + w + inp.value.slice(b);
  else if (last && v.endsWith(last)) nv = v.slice(0, v.length - last.length) + w;
  else nv = v ? v + ' ' + w : w;
  const caret = nv.length;
  state.lastIns[slot] = w;
  inp.value = nv; state.values[slot] = nv; update();
  inp.focus(); inp.setSelectionRange(caret, caret);
}

/* ── 보고서 어휘: 다른 말 찾기 ── */
// 일상어 → 어휘에 있는 대표 말 (검색 도우미)
const EASY = { '늘리다': '증가', '늘다': '증가', '늘어나다': '증가', '줄이다': '감소', '줄다': '감소', '줄어들다': '감소', '높이다': '향상',
  '올리다': '상승', '낮추다': '저감', '만들다': '구축', '세우다': '수립', '바꾸다': '전환', '고치다': '개선', '좋아지다': '향상',
  '나빠지다': '악화', '없다': '부재', '모자라다': '부족', '부족하다': '부족', '시작하다': '착수', '하다': '추진', '돕다': '지원',
  '함께': '협업', '같이': '협업', '그리고': '또한', '그래서': '따라서', '그런데': '한편', '왜냐하면': '때문에', '빠르게': '신속', '계속': '지속' };
function findGroups(q, withDomain) {
  const base = q.replace(/(하다|하기|한다|되다|이다|다)$/, '');
  const keys = [...new Set([q, base, EASY[q]].filter(k => k && k.length))];
  const scored = [];
  for (const g of VOCAB.groups) {
    if (!withDomain && g.domain !== '일반') continue;
    let s = 0;
    if (g.words.some(w => keys.includes(w))) s += 3;
    if (keys.some(k => g.name.includes(k) || g.desc.includes(k))) s += 2;
    if (keys.some(k => k.length >= 2 && g.words.some(w => w !== k && w.includes(k)))) s += 1;
    if (s) scored.push({ g, s });
  }
  return { keys, list: scored.sort((a, b) => b.s - a.s).slice(0, 8).map(x => x.g) };
}
function renderFind() {
  const q = $('findQ').value.trim(), out = $('findResults');
  if (!q) { out.innerHTML = '<p class="find-empty">찾을 말을 입력하세요. 단어를 누르면 복사됩니다.</p>'; return; }
  const { keys, list } = findGroups(q, $('findDomain').checked);
  if (!list.length) {
    const inDomain = !$('findDomain').checked && findGroups(q, true).list.length;
    out.innerHTML = `<p class="find-empty">‘${esc(q)}’${josaFor(q, '과')} 같은 자리에 쓰는 말을 찾지 못했습니다. ` +
      (inDomain ? '분야 어휘에 있습니다 — 위의 ‘분야 어휘 포함’을 켜 보세요.' : '더 짧게 쓰거나(예: 늘리다 → 증가) 다른 말로 찾아보세요.') + '</p>';
    return;
  }
  const hit = w => keys.includes(w);
  out.innerHTML = list.map(g => `<div class="fr"><div class="fr-h"><b>${esc(g.name)}</b><span class="cat">${esc(g.domain === '일반' ? g.category : g.domain)}</span><span class="d">${esc(g.desc)}</span></div>
    <div class="words">${wordChips(g.words, hit)}</div>${g.cautions.length ? `<p class="sg-desc"><span class="warn">주의: ${esc(g.cautions.join(' / '))}</span></p>` : ''}</div>`).join('');
  out.querySelectorAll('.word').forEach(b => b.addEventListener('click', async () => {
    try { await navigator.clipboard.writeText(b.dataset.w); }
    catch (e) { const t = document.createElement('textarea'); t.value = b.dataset.w; document.body.append(t); t.select(); document.execCommand('copy'); t.remove(); }
    toast(`‘${b.dataset.w}’ 복사했습니다`);
  }));
}
let findT;
$('findQ').addEventListener('input', () => { clearTimeout(findT); findT = setTimeout(renderFind, 120); });
$('findDomain').addEventListener('change', renderFind);
renderFind();

$('copy').addEventListener('click', async () => {
  const text = $('result').textContent;
  try { await navigator.clipboard.writeText(text); }
  catch (e) { const t = document.createElement('textarea'); t.value = text; document.body.append(t); t.select(); document.execCommand('copy'); t.remove(); }
  toast('복사했습니다');
});
$('clear').addEventListener('click', () => { current().slots.forEach(s => delete state.values[s]); renderFill(); $('madlib').querySelector('input')?.focus(); });
function toast(msg) { const t = $('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('show'), 1600); }
window.addEventListener('resize', () => $('madlib').querySelectorAll('input').forEach(fit));

/* 사용안내서 창 — Esc나 바깥(어두운 곳)을 눌러도 닫힌다 */
const guide = $('guide');
$('openGuide').addEventListener('click', () => { guide.showModal(); guide.scrollTop = 0; });
$('closeGuide').addEventListener('click', () => guide.close());
guide.addEventListener('click', e => { if (e.target === guide) guide.close(); });
guide.querySelectorAll('.copy-code').forEach(b => b.addEventListener('click', async () => {
  const text = b.nextElementSibling.textContent;
  try { await navigator.clipboard.writeText(text); }
  catch (e) { const t = document.createElement('textarea'); t.value = text; guide.append(t); t.select(); document.execCommand('copy'); t.remove(); }
  b.textContent = '복사됨'; setTimeout(() => { b.textContent = '복사'; }, 1500); // 창 위에서는 아래쪽 알림이 가려지므로 버튼에 표시
}));

$('about').textContent = `${DATA.title} · ${DATA.about} 보고서 어휘 ${VOCAB.groups.length}묶음은 공공기관·대기업 보고서에서 모은 실전 용어입니다.`;
state.pid = patternsOf(state.rel)[0].id;
render();
</script>
