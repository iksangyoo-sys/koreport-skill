<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>보고서 문장 공식 찾기</title>
<link rel="icon" href="data:," />
<!-- 이 파일은 scripts/build_patterns.py가 assets/sentence-patterns.json으로 만든다. 직접 고치지 말고 템플릿이나 JSON을 고친다. -->
<style>
:root {
  color-scheme: light;
  --bg: #f5f6f8; --surface: #ffffff; --line: #e1e5eb; --line-strong: #c8cfd9;
  --text-1: #15181d; --text-2: #4a5260; --text-3: #8a93a3;
  --accent: #1d4e89; --accent-2: #2f6fbf; --accent-soft: #e9f0fa;
  --slot: #fff4d6; --slot-line: #e7c35a; --ok: #0a7a3c;
  --radius: 10px;
  --font: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", "맑은 고딕", "Noto Sans KR", sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--text-1); font-family: var(--font); font-size: 15px; line-height: 1.6; }
button, input, textarea { font: inherit; color: inherit; }
header { background: var(--accent); color: #fff; }
.wrap { max-width: 1240px; margin: 0 auto; padding: 0 20px; }
header .wrap { padding-top: 22px; padding-bottom: 22px; }
header h1 { margin: 0; font-size: 22px; letter-spacing: -.01em; }
header p { margin: 4px 0 0; opacity: .85; font-size: 14px; }
main.wrap { padding-top: 18px; padding-bottom: 48px; }

.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px 18px; }
.step { display: flex; gap: 10px; align-items: baseline; margin: 0 0 8px; }
.step b { display: inline-grid; place-items: center; width: 22px; height: 22px; border-radius: 50%; background: var(--accent); color: #fff; font-size: 12px; flex: none; }
.step span { font-weight: 700; }
.step small { color: var(--text-3); font-weight: 400; }
.search { width: 100%; border: 1px solid var(--line-strong); border-radius: 8px; padding: 10px 12px; background: #fff; }
.search:focus, .slot-input:focus { outline: 2px solid var(--accent-2); outline-offset: 1px; border-color: transparent; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.chip { border: 1px solid var(--line-strong); background: #fff; border-radius: 999px; padding: 4px 12px; cursor: pointer; font-size: 13.5px; }
.chip:hover { border-color: var(--accent-2); color: var(--accent-2); }
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }
.chip .n { opacity: .65; margin-left: 4px; font-size: 12px; }
.hint { color: var(--text-2); font-size: 13px; margin: 8px 0 0; }
.filters { display: grid; gap: 14px; }
.suggest { margin-top: 8px; font-size: 13.5px; color: var(--text-2); }
.suggest button { border: 0; background: var(--accent-soft); color: var(--accent); border-radius: 6px; padding: 2px 8px; margin: 2px 4px 0 0; cursor: pointer; font-weight: 600; }

.layout { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 6fr); gap: 16px; margin-top: 16px; align-items: start; }
.list-head { display: flex; justify-content: space-between; align-items: baseline; margin: 0 2px 8px; }
.list-head h2, .detail h2, .map h2 { margin: 0; font-size: 16px; }
.list-head span { color: var(--text-3); font-size: 13px; }
.cards { display: grid; grid-template-columns: minmax(0, 1fr); gap: 8px; }
.layout > section { min-width: 0; }
.card { text-align: left; width: 100%; border: 1px solid var(--line); background: var(--surface); border-radius: var(--radius); padding: 12px 14px; cursor: pointer; }
.card:hover { border-color: var(--accent-2); }
.card[aria-current="true"] { border-color: var(--accent); box-shadow: inset 4px 0 0 var(--accent); }
.card .top { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.card .id { font-weight: 800; color: var(--accent); }
.card .rel { font-weight: 700; }
.card .combo { color: var(--text-2); font-size: 13px; }
.card .formula { margin-top: 4px; font-size: 14px; }
.card .ex { margin-top: 4px; color: var(--text-3); font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tags { display: inline-flex; gap: 4px; flex-wrap: wrap; }
.tag { font-size: 11.5px; padding: 0 7px; border-radius: 4px; background: #eef1f5; color: var(--text-2); }
.empty { padding: 28px; text-align: center; color: var(--text-3); background: var(--surface); border: 1px dashed var(--line-strong); border-radius: var(--radius); }

.detail { position: sticky; top: 12px; }
.detail .head { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.detail .relformula { color: var(--text-2); font-size: 13.5px; margin: 4px 0 0; }
.detail .desc { margin: 6px 0 0; font-size: 14px; }
.tabs { display: flex; gap: 6px; margin: 14px 0 8px; flex-wrap: wrap; }
.tab { border: 1px solid var(--line-strong); background: #fff; border-radius: 6px; padding: 3px 10px; cursor: pointer; font-size: 13px; }
.tab[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); font-weight: 700; }
.formula-big { font-size: 15px; padding: 10px 12px; background: #f8fafc; border: 1px solid var(--line); border-radius: 8px; }
.slots { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; margin-top: 12px; }
.slot label { display: block; font-size: 12.5px; font-weight: 700; color: var(--text-2); }
.slot label small { font-weight: 400; color: var(--text-3); }
.slot-input { width: 100%; border: 1px solid var(--line-strong); border-radius: 7px; padding: 8px 10px; background: #fff; margin-top: 3px; }
.message { margin-top: 12px; }
.message textarea { width: 100%; min-height: 44px; resize: vertical; border: 1px solid var(--line-strong); border-radius: 7px; padding: 8px 10px; }
.result { margin-top: 14px; border: 2px solid var(--accent); border-radius: 10px; padding: 12px 14px; background: #fff; }
.result .lbl { font-size: 12px; font-weight: 700; color: var(--accent); }
.result .sentence { font-size: 17px; font-weight: 600; margin-top: 2px; word-break: keep-all; }
.result .sentence .blank { background: var(--slot); border-bottom: 2px solid var(--slot-line); padding: 0 3px; border-radius: 3px; color: var(--text-2); font-weight: 500; }
.result .row { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
.result .remind { font-size: 12.5px; color: var(--text-2); }
.btn { border: 1px solid var(--accent); background: var(--accent); color: #fff; border-radius: 7px; padding: 6px 14px; cursor: pointer; font-weight: 600; }
.btn.ghost { background: #fff; color: var(--accent); }
.btn:disabled { opacity: .45; cursor: default; }
.tip { margin-top: 12px; font-size: 13.5px; background: var(--accent-soft); border-radius: 8px; padding: 8px 12px; }
.examples { margin: 14px 0 0; padding: 0; list-style: none; display: grid; gap: 6px; }
.examples li { font-size: 14px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: #fbfcfd; }
.examples-head { margin-top: 16px; font-size: 13px; font-weight: 700; color: var(--text-2); display: flex; justify-content: space-between; }
.examples-head small { font-weight: 400; color: var(--text-3); }

.map { margin-top: 28px; }
.map p { color: var(--text-2); font-size: 13.5px; margin: 4px 0 10px; }
.map-scroll { overflow-x: auto; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); }
table { border-collapse: collapse; width: 100%; min-width: 620px; font-size: 13.5px; }
th, td { border-bottom: 1px solid var(--line); padding: 8px 10px; text-align: left; vertical-align: top; }
th { background: #f3f5f8; color: var(--text-2); font-weight: 700; }
td .pid { border: 1px solid var(--line-strong); background: #fff; border-radius: 6px; padding: 1px 7px; margin: 0 4px 4px 0; cursor: pointer; font-weight: 700; color: var(--accent); font-size: 12.5px; }
td .pid:hover { border-color: var(--accent); background: var(--accent-soft); }
footer { color: var(--text-3); font-size: 12.5px; text-align: center; padding: 8px 20px 28px; }
.toast { position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%); background: #15181d; color: #fff; padding: 8px 14px; border-radius: 8px; font-size: 13.5px; opacity: 0; transition: opacity .2s; pointer-events: none; }
.toast.show { opacity: 1; }

@media (max-width: 900px) {
  .layout { grid-template-columns: minmax(0, 1fr); }
  .detail { position: static; order: -1; }
}
@media (max-width: 560px) {
  .wrap { padding: 0 16px; }
  .slots { grid-template-columns: 1fr; }
  header h1 { font-size: 19px; }
}
</style>
</head>
<body>
<header>
  <div class="wrap">
    <h1>보고서 문장 공식 찾기</h1>
    <p>한국 기업 의사결정 보고서의 문장 패턴 22 — 보고 단계와 문장 관계를 고르면 공식이 나오고, 빈칸을 채우면 문장이 조립됩니다.</p>
  </div>
</header>

<main class="wrap">
  <section class="panel filters" aria-label="공식 찾기 조건">
    <div>
      <p class="step"><b>1</b><span>이 문장으로 하고 싶은 말이나 키워드</span><small>예: 비율, 전환, 원인, 개선 필요, 정의</small></p>
      <input id="q" class="search" type="search" placeholder="하고 싶은 말이나 키워드를 입력하세요" autocomplete="off" />
      <div id="suggest" class="suggest" hidden></div>
    </div>
    <div>
      <p class="step"><b>2</b><span>보고서의 어느 단계에 들어가는 문장인가요?</span></p>
      <div id="areaChips" class="chips" role="group" aria-label="보고 단계"></div>
      <p id="areaDesc" class="hint"></p>
    </div>
    <div>
      <p class="step"><b>3</b><span>무엇과 무엇의 관계를 말하나요?</span></p>
      <div id="relChips" class="chips" role="group" aria-label="문장 관계"></div>
    </div>
  </section>

  <div class="layout">
    <section aria-label="패턴 목록">
      <div class="list-head"><h2>맞는 공식</h2><span id="count"></span></div>
      <div id="cards" class="cards"></div>
    </section>
    <section id="detail" class="panel detail" aria-live="polite"></section>
  </div>

  <section class="map" aria-label="한눈에 보기">
    <h2>한눈에 보기 — 문장 관계 × 보고 단계</h2>
    <p>칸의 번호를 누르면 그 공식으로 이동합니다.</p>
    <div class="map-scroll"><table id="map"></table></div>
  </section>
</main>

<footer id="about"></footer>
<div id="toast" class="toast" role="status"></div>

<script>
const DATA = /*__PATTERN_DATA__*/null;

const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const REL = Object.fromEntries(DATA.relations.map(r => [r.id, r]));
const state = { q: '', area: '', rel: '', selected: DATA.patterns[0].id, variant: 0, values: {}, message: '' };

/* ── 조사: 앞말 받침에 맞춰 고른다 ───────────────────────────── */
const JOSA = {
  '은': ['은', '는', '은(는)'], '이': ['이', '가', '이(가)'], '을': ['을', '를', '을(를)'], '과': ['과', '와', '과(와)'],
  '으로': ['으로', '로', '(으)로'], '이란': ['이란', '란', '(이)란'], '이나': ['이나', '나', '(이)나'],
  '이었으나': ['이었으나', '였으나', '(이)었으나'],
};
const DIGIT_JONG = { '0': 21, '1': 8, '2': 0, '3': 16, '4': 0, '5': 0, '6': 1, '7': 8, '8': 8, '9': 0 }; // 영 일 이 삼 사 오 육 칠 팔 구
function jong(word) {
  const s = String(word).replace(/[\s)\]」』’'"”.,·∙!?%]+$/u, '');
  const ch = s.slice(-1);
  if (!ch) return null;
  const code = ch.charCodeAt(0);
  if (code >= 0xAC00 && code <= 0xD7A3) return (code - 0xAC00) % 28;
  if (ch in DIGIT_JONG) return DIGIT_JONG[ch];
  return null; // 영문 등 — 알 수 없음
}
function attach(word, josa) {
  const [withJ, withoutJ, unknown] = JOSA[josa];
  const j = jong(word);
  if (j === null) return word + unknown;
  if (josa === '으로') return word + (j === 0 || j === 8 ? '로' : '으로'); // ㄹ받침은 '로'
  return word + (j === 0 ? withoutJ : withJ);
}

/* ── 템플릿 렌더링 ───────────────────────────────────────────── */
const SLOT = /\{([^}:]+)(?::([^}]+))?\}/g;
function renderText(tpl, values) {
  return tpl.replace(SLOT, (_, slot, josa) => {
    const v = (values[slot] || '').trim();
    if (!v) return `(${slot})` + (josa ? JOSA[josa][2] : '');
    return josa ? attach(v, josa) : v;
  });
}
function renderHTML(tpl, values) {
  let out = '', last = 0;
  tpl.replace(SLOT, (m, slot, josa, idx) => {
    out += esc(tpl.slice(last, idx));
    const v = (values[slot] || '').trim();
    if (!v) out += `<span class="blank">(${esc(slot)})</span>` + (josa ? esc(JOSA[josa][2]) : '');
    else out += esc(josa ? attach(v, josa) : v);
    last = idx + m.length;
    return m;
  });
  return out + esc(tpl.slice(last));
}

/* ── 검색: 관계 키워드·공식·예문에 점수를 매긴다 ─────────────────── */
function tokens(q) { return q.toLowerCase().split(/[\s,]+/).filter(t => t.length >= 1); }
function score(p, q) {
  if (!q) return 1;
  const r = REL[p.relation];
  let s = 0;
  for (const t of tokens(q)) {
    if (r.name.includes(t)) s += 6;
    if (r.keywords.some(k => k.includes(t) || t.includes(k))) s += 4;
    if (p.combo.toLowerCase().includes(t) || p.slots.some(x => x.includes(t))) s += 3;
    if (p.tip.includes(t) || r.desc.includes(t)) s += 1;
    s += Math.min(3, p.examples.filter(e => e.toLowerCase().includes(t)).length);
  }
  return s;
}
function matches() {
  return DATA.patterns
    .filter(p => (!state.area || p.areas.includes(state.area)) && (!state.rel || p.relation === state.rel))
    .map(p => ({ p, s: score(p, state.q) }))
    .filter(x => x.s > 0)
    .sort((a, b) => b.s - a.s || DATA.patterns.indexOf(a.p) - DATA.patterns.indexOf(b.p))
    .map(x => x.p);
}

/* ── 화면 ───────────────────────────────────────────────────── */
function chip(label, pressed, n, onClick) {
  const b = document.createElement('button');
  b.className = 'chip'; b.type = 'button'; b.setAttribute('aria-pressed', pressed);
  b.innerHTML = esc(label) + (n != null ? `<span class="n">${n}</span>` : '');
  b.addEventListener('click', onClick);
  return b;
}
function renderChips() {
  const a = $('areaChips'); a.innerHTML = '';
  a.append(chip('전체', !state.area, null, () => { state.area = ''; renderAll(); }));
  DATA.areas.forEach(x => a.append(chip(x.id, state.area === x.id, DATA.patterns.filter(p => p.areas.includes(x.id)).length,
    () => { state.area = state.area === x.id ? '' : x.id; renderAll(); })));
  $('areaDesc').textContent = state.area ? DATA.areas.find(x => x.id === state.area).desc : '단계를 고르면 그 단계에 쓰는 공식만 남습니다.';
  const r = $('relChips'); r.innerHTML = '';
  r.append(chip('전체', !state.rel, null, () => { state.rel = ''; renderAll(); }));
  DATA.relations.forEach(x => r.append(chip(x.name, state.rel === x.id, DATA.patterns.filter(p => p.relation === x.id).length,
    () => { state.rel = state.rel === x.id ? '' : x.id; renderAll(); })));
}
function renderSuggest() {
  const box = $('suggest');
  if (!state.q) { box.hidden = true; return; }
  const ranked = DATA.relations.map(r => ({ r, s: tokens(state.q).reduce((a, t) => a + (r.name.includes(t) ? 6 : 0) + (r.keywords.some(k => k.includes(t) || t.includes(k)) ? 4 : 0), 0) }))
    .filter(x => x.s > 0).sort((a, b) => b.s - a.s).slice(0, 3);
  if (!ranked.length) { box.hidden = true; return; }
  box.hidden = false;
  box.innerHTML = '이런 관계를 말하려는 건가요? ' + ranked.map(x => `<button type="button" data-rel="${x.r.id}">${esc(x.r.name)}</button>`).join('');
  box.querySelectorAll('button').forEach(b => b.addEventListener('click', () => { state.rel = b.dataset.rel; renderAll(); }));
}
function renderCards() {
  const list = matches();
  $('count').textContent = `${list.length}개 / 22개`;
  const box = $('cards');
  if (!list.length) { box.innerHTML = '<div class="empty">조건에 맞는 공식이 없습니다. 단계나 관계를 ‘전체’로 바꿔 보세요.</div>'; return; }
  if (!list.some(p => p.id === state.selected)) { state.selected = list[0].id; state.variant = 0; }
  box.innerHTML = list.map(p => `<button type="button" class="card" data-id="${p.id}" aria-current="${p.id === state.selected}">
      <div class="top"><span class="id">${p.id}</span><span class="rel">${esc(REL[p.relation].name)}</span><span class="combo">${esc(p.combo)}</span>
        <span class="tags">${p.areas.map(a => `<span class="tag">${esc(a)}</span>`).join('')}</span></div>
      <div class="formula">${renderHTML(p.template, {})}</div>
      <div class="ex">예) ${esc(p.examples[0] || '')}</div></button>`).join('');
  box.querySelectorAll('.card').forEach(c => c.addEventListener('click', () => select(c.dataset.id, true)));
}
function select(id, scroll) {
  if (state.selected !== id) { state.selected = id; state.variant = 0; }
  renderCards(); renderDetail();
  if (scroll && window.innerWidth <= 900) $('detail').scrollIntoView({ behavior: 'smooth', block: 'start' });
}
function current() { return DATA.patterns.find(p => p.id === state.selected); }
function templates(p) { return [p.template, ...p.variants]; }
function renderDetail() {
  const p = current(); const r = REL[p.relation];
  const tpls = templates(p); const tpl = tpls[state.variant] || tpls[0];
  const slotDesc = DATA.slots;
  $('detail').innerHTML = `
    <div class="head"><h2>${p.id}. ${esc(r.name)}</h2><span class="tags">${p.areas.map(a => `<span class="tag">${esc(a)}</span>`).join('')}</span></div>
    <p class="relformula">${esc(r.formula)}</p>
    <p class="desc">${esc(r.desc)}${r.note ? ' ' + esc(r.note) : ''}</p>
    <div class="tabs" role="group" aria-label="공식 선택">${tpls.map((t, i) => `<button type="button" class="tab" data-i="${i}" aria-pressed="${i === state.variant}">${i ? '변형 ' + i : '기본 공식'}</button>`).join('')}</div>
    <div class="formula-big">${renderHTML(tpl, {})}</div>
    <div class="message slot"><label for="msg">먼저, 이 문장으로 독자에게 말하려는 것 <small>(한 줄 메모 — 공식은 메시지를 담는 그릇입니다)</small></label>
      <textarea id="msg" placeholder="예: 부서 간 협업이 막혀 있어 제도를 바꿔야 한다">${esc(state.message)}</textarea></div>
    <div class="slots">${p.slots.map(s => `<div class="slot"><label for="s_${esc(s)}">${esc(s)} <small>${esc(slotDesc[s] || '')}</small></label>
      <input class="slot-input" id="s_${esc(s)}" data-slot="${esc(s)}" value="${esc(state.values[s] || '')}" autocomplete="off" /></div>`).join('')}</div>
    <div class="result">
      <div class="lbl">조립된 문장</div>
      <div class="sentence" id="sentence"></div>
      <div class="row"><span class="remind" id="remind"></span>
        <span><button type="button" class="btn ghost" id="clear">지우기</button> <button type="button" class="btn" id="copy">복사</button></span></div>
    </div>
    <div class="tip">💡 ${esc(p.tip)}</div>
    <div class="examples-head"><span>예문 ${p.examples.length}개</span><small>구조만 참고하세요 · 수치는 O로 가렸습니다</small></div>
    <ul class="examples">${p.examples.map(e => `<li>${esc(e)}</li>`).join('')}</ul>`;
  $('detail').querySelectorAll('.tab').forEach(b => b.addEventListener('click', () => { state.variant = +b.dataset.i; renderDetail(); }));
  $('detail').querySelectorAll('.slot-input').forEach(inp => inp.addEventListener('input', () => { state.values[inp.dataset.slot] = inp.value; updateSentence(); }));
  $('msg').addEventListener('input', e => { state.message = e.target.value; updateSentence(); });
  $('clear').addEventListener('click', () => { p.slots.forEach(s => delete state.values[s]); renderDetail(); });
  $('copy').addEventListener('click', copySentence);
  updateSentence();
}
function updateSentence() {
  const p = current(); const tpl = templates(p)[state.variant] || p.template;
  $('sentence').innerHTML = renderHTML(tpl, state.values);
  const missing = p.slots.filter(s => !(state.values[s] || '').trim());
  $('copy').disabled = missing.length === p.slots.length;
  $('remind').textContent = missing.length ? `비어 있는 빈칸: ${missing.join(', ')}` : (state.message.trim() ? '메모한 메시지가 문장에 담겼는지 확인하세요.' : '완성! 명사형 종결인지, 숫자로 바꿀 말이 없는지 확인하세요.');
}
async function copySentence() {
  const p = current(); const text = renderText(templates(p)[state.variant] || p.template, state.values);
  try { await navigator.clipboard.writeText(text); }
  catch (e) { const t = document.createElement('textarea'); t.value = text; document.body.append(t); t.select(); document.execCommand('copy'); t.remove(); }
  toast('문장을 복사했습니다');
}
function toast(msg) { const t = $('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('show'), 1800); }
function renderMap() {
  $('map').innerHTML = `<thead><tr><th>관계 \\ 단계</th>${DATA.areas.map(a => `<th>${esc(a.id)}</th>`).join('')}</tr></thead><tbody>${
    DATA.relations.map(r => `<tr><th>${esc(r.name)}</th>${DATA.areas.map(a => `<td>${
      DATA.patterns.filter(p => p.relation === r.id && p.areas.includes(a.id)).map(p => `<button type="button" class="pid" data-id="${p.id}" title="${esc(p.combo)}">${p.id}</button>`).join('')
    }</td>`).join('')}</tr>`).join('')}</tbody>`;
  $('map').querySelectorAll('.pid').forEach(b => b.addEventListener('click', () => {
    const p = DATA.patterns.find(x => x.id === b.dataset.id);
    state.q = ''; $('q').value = ''; state.area = ''; state.rel = p.relation;
    renderAll(); select(p.id, false); window.scrollTo({ top: 0, behavior: 'smooth' });
  }));
}
function renderAll() { renderChips(); renderSuggest(); renderCards(); renderDetail(); }

let qt;
$('q').addEventListener('input', e => { clearTimeout(qt); qt = setTimeout(() => { state.q = e.target.value.trim(); renderSuggest(); renderCards(); renderDetail(); }, 120); });
$('about').textContent = `${DATA.title} · v${DATA.version} · ${DATA.about}`;
renderMap();
renderAll();
</script>
</body>
